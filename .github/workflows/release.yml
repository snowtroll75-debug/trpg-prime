name: Package Foundry System

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('system.json')); if ('v'+m.version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - name: Package installable files
        run: |
          mkdir -p dist/trg-prime
          cp system.json template.json dist/trg-prime/
          for dir in assets lang module packs scripts styles templates; do
            if [ -d "$dir" ]; then cp -a "$dir" dist/trg-prime/; fi
          done
          cd dist
          zip -qr ../trg-prime.zip trg-prime
      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "TRG Prime Foundry VTT system release"
          gh release upload "$GITHUB_REF_NAME" trg-prime.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: trg-prime-package
          path: trg-prime.zip
